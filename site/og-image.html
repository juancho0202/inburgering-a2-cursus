<!doctype html>
<!-- Source of public/og-image.png (the picture shown when the site is shared). Re-render after changing it:
     node scripts/og-image.cjs -->
<html lang="en">
<head><meta charset="UTF-8" /><style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; box-sizing: border-box; padding: 80px 90px; background: #14171b; color: #eef0f2;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 24px; font-size: 44px; font-weight: 800; }
  .logo { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 30px; background: #ff9438; color: #fff; font-size: 44px; }
  h1 { margin: 0; font-size: 84px; line-height: 1.05; font-weight: 800; max-width: 980px; }
  p { margin: 0; font-size: 34px; color: #a3acb7; }
  .bar { height: 12px; width: 220px; border-radius: 6px; background: #ff9438; }
</style></head>
<body>
  <div class="brand"><span class="logo">NL</span> Train for Inburgering</div>
  <div>
    <h1>Free inburgering practice exam (A2)</h1>
    <p style="margin-top:24px">Reading · Listening · KNM · Writing · No account needed</p>
  </div>
  <div class="bar"></div>
</body>
</html>
