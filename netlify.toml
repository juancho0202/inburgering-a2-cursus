# Netlify builds the static site. The build fails when the course content is invalid (see scripts/vitePluginCourse.ts).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The newest 24.x; .npmrc stops the build if it is older than the patched minimum in package.json "engines".
  NODE_VERSION = "24"

# One address for search engines: the .nl domain and www go to https://trainforinburgering.com (permanently).
[[redirects]]
  from = "https://trainforinburgering.nl/*"
  to = "https://trainforinburgering.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.trainforinburgering.nl/*"
  to = "https://trainforinburgering.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.trainforinburgering.com/*"
  to = "https://trainforinburgering.com/:splat"
  status = 301
  force = true

# Single-page app: every path serves index.html (real files such as /assets/* and /sw.js are served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
